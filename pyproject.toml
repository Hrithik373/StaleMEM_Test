[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stale-repro"
version = "0.1.0"
description = "Reproducing and stress-testing STALE / CUPMem (write-side state adjudication for agent memory)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embed = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
